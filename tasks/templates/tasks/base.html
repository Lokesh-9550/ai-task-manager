{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Task Manager{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tasks/style.css' %}" />
</head>
<body>
  <nav class="navbar">
    <a href="{% url 'task-list' %}" class="brand">Task Manager</a>
    <div class="nav-links">
      <a href="{% url 'task-list' %}">Tasks</a>
      <a href="{% url 'project-list' %}">Projects</a>
      <a href="{% url 'task-create' %}" class="btn-primary-sm">+ New Task</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'tasks/app.js' %}"></script>
</body>
</html>
